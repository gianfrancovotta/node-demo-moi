<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NODE across Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap">
<style>
/* Layout: full-bleed indigo field; oversized uppercase headline; phase pills + replay; map left, phase model right */
:root{
  --ink:#ffffff; --soft:#c9cdea; --mute:#9aa0cc; --line:rgba(255,255,255,.28);
  --deep:#1a2466; --navy:#1b2770; --land:rgba(255,255,255,.10); --land-edge:rgba(255,255,255,.22);
  --p1:#ffffff; --p2:#8fb8ff; --p3:#c5b6ff;
  --font:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--navy)}
html,body{margin:0}
body{
  font-family:var(--font);color:var(--ink);background:var(--deep);
  background-image:
    radial-gradient(120% 80% at 85% 20%, rgba(120,110,190,.55) 0%, transparent 55%),
    radial-gradient(90% 70% at 10% 90%, rgba(40,70,170,.55) 0%, transparent 60%),
    linear-gradient(160deg,#1b2770 0%,#2d3b8f 45%,#4a4590 75%,#5d4f95 100%);
  min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(28px,env(safe-area-inset-top,0px));padding-bottom:max(36px,env(safe-area-inset-bottom,0px));
}
.wrap{max-width:1240px;margin:0 auto}
.eyebrow{font-size:.95rem;color:var(--soft);letter-spacing:.02em}
h1{font-weight:400;text-transform:uppercase;font-size:clamp(2.6rem,8.2vw,7rem);line-height:.98;letter-spacing:-.015em;margin:.25em 0 .35em}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 36px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:12px}
.pill{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.7);color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.pill b{font-weight:500;font-size:1.05rem}
.pill span{font-size:.9rem;color:var(--soft);transition:color .25s}
.pill:hover{background:rgba(255,255,255,.12)}
.pill[aria-selected="true"]{background:var(--ink);color:var(--navy);border-color:var(--ink)}
.pill[aria-selected="true"] span{color:#4a4f86}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.replay svg{width:14px;height:14px}
.replay[aria-pressed="true"]{background:var(--ink);color:var(--navy)}
@media (max-width:560px){.pill{padding:11px 18px}.tabs .pill span{display:none}}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:24px}}
.mapbox{position:relative}
svg#map{width:100%;height:auto;display:block}
.country{fill:var(--land);stroke:var(--land-edge);stroke-width:.6}
.arc{fill:none;stroke-width:1.3;stroke-linecap:round}
.pin{cursor:pointer}
.pin text{font:400 12px var(--font);fill:var(--ink);pointer-events:none;letter-spacing:.01em}
.stamp{position:absolute;left:4px;top:0;font-size:.9rem;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.hint{position:absolute;left:4px;bottom:0;font-size:.85rem;color:var(--mute)}
.tip{position:absolute;z-index:5;width:min(290px,80vw);padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.97);color:var(--navy);box-shadow:0 18px 40px rgba(10,15,60,.35);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.tip.on{opacity:1;transform:none}
.tip.pinned{pointer-events:auto}
.tip .t-when{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#5b62a0}
.tip h3{margin:4px 0 2px;font-weight:500;font-size:1.25rem}
.tip .t-c{font-size:.88rem;color:#5b62a0}
.tip p{margin:10px 0 0;font-size:.92rem;line-height:1.45;color:#26306e}
.tip .t-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tip .t-tags span{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#e8eaf7;color:var(--navy)}
.tip .t-score{margin-top:10px;font-size:.82rem;color:#5b62a0}
.panel{display:flex;flex-direction:column;gap:18px}
.when{font-size:.95rem;color:var(--soft)}
.panel h2{font-weight:400;font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1.12;margin:0}
.lead{color:var(--soft);font-size:1.02rem;line-height:1.5;margin:0;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:16px 0}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat b{display:block;font-weight:300;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:.85rem;color:var(--soft)}
.model{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px}
.model dt,.model dd{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.model dt{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:15px}
.model dd{font-size:1rem;line-height:1.4}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:.82rem;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">NODE · NEXTCHEM · 2026-2036</div>
  <h1>NODE across<br>Europe</h1>

  <div class="controls">
    <div class="tabs" role="tablist" aria-label="Phase">
      <button class="pill" role="tab" data-p="1"><b>Phase 1 · Launch</b><span>Years 1-2</span></button>
      <button class="pill" role="tab" data-p="2"><b>Phase 2 · Wave 1</b><span>Years 3-5</span></button>
      <button class="pill" role="tab" data-p="3"><b>Phase 2 · Wave 2</b><span>Years 6-10</span></button>
    </div>
    <button class="pill replay" id="replay" aria-pressed="false"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg><b>Replay the 10 years</b></button>
  </div>

  <div class="grid">
    <div class="mapbox" id="mapbox">
      <div class="stamp" id="stamp"></div>
      <svg id="map" viewBox="0 0 720 580" role="img" aria-label="Map of Europe with NODE hubs by phase"></svg>
      <div class="hint">Hover or tap a site to see its role</div>
      <div class="tip" id="tip" role="status"></div>
    </div>
    <div class="panel">
      <div class="when" id="when"></div>
      <h2 id="title"></h2>
      <p class="lead" id="lead"></p>
      <div class="stats">
        <div class="stat"><b id="sHubs">0</b><span>NODE hubs</span></div>
        <div class="stat"><b id="sSpokes">0</b><span>spokes</span></div>
        <div class="stat"><b id="sCountries">0</b><span>countries</span></div>
      </div>
      <dl class="model">
        <dt>Startups pay with</dt><dd id="mPay"></dd>
        <dt>NODE gives</dt><dd id="mGive"></dd>
        <dt>The AI</dt><dd id="mAI"></dd>
      </dl>
    </div>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i style="background:var(--p1)"></i>NODE hub in Rome</span>
      <span><i style="background:var(--p2)"></i>Wave 1 hubs</span>
      <span><i style="background:var(--p3)"></i>Wave 2 hubs</span>
      <span><i style="background:transparent;border:1.5px dashed var(--p2)"></i>Spokes in NEXTCHEM centres</span>
      <span><i style="background:transparent;border:1.5px solid rgba(255,255,255,.6)"></i>NEXTCHEM R&amp;D centres (internal)</span>
    </div>
    <div>Group 3</div>
  </div>
</div>

rg.append("stop").attr("offset","100%").attr("stop-color","#000");
defs.append("mask").attr("id","edge").append("rect").attr("width",W).attr("height",H).attr("fill","url(#fade)");
svg.append("g").attr("mask","url(#edge)").selectAll("path").data(GEO.features).join("path").attr("class","country").attr("d",path);
const gA=svg.append("g"), gP=svg.append("g");
const rome=proj([12.50,41.90]);
const left=new Set(["milan","basel","rotterdam","lyon","antwerp"]);
const dy={brescia:-13,marghera:12,sittard:10,rotterdam:-6,antwerp:7,frankfurt:13};
const small=new Set(["rotterdam","antwerp","sittard","milan","brescia"]);

// Current role of every site, after applying the events shown
function state(){
  const evs = limit==null ? EVENTS.filter(e=>e.p<=phase) : EVENTS.slice(0,limit);
  const m=new Map();
  evs.forEach(e=>{const prev=m.get(e.id); m.set(e.id,{...SITES[e.id],id:e.id,...e,name:e.name||SITES[e.id].name,since:e.type==="hub"?e.p:(prev&&prev.type==="hub"?prev.since:e.p)});});
  return [...m.values()];
}
const colOf=d=>d.type==="centre"?GREY:(d.type==="spoke"?COL[2]:COL[d.p]);

const tip=document.getElementById("tip"), box=document.getElementById("mapbox");
function showTip(d,pinned){
  tip.innerHTML=`<div class="t-when">${PH[d.p].when}</div><h3>${d.name}${d.id==="sittard"&&d.type==="hub"?" (Sittard)":""}</h3><div class="t-c">${d.country} · ${TYPE[d.type]}</div><p>${d.why}</p>`+
    (d.tags&&d.tags.length?`<div class="t-tags">${d.tags.map(t=>`<span>${t}</span>`).join("")}</div>`:"")+
    (d.score?`<div class="t-score">Site score ${d.score}/100</div>`:"");
  const r=svg.node().getBoundingClientRect(), b=box.getBoundingClientRect();
  const [x,y]=proj([d.lon,d.lat]); const px=r.left-b.left+x*r.width/W, py=r.top-b.top+y*r.height/H;
  tip.classList.add("on"); tip.classList.toggle("pinned",!!pinned);
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  let lx=px+18; if(lx+tw>b.width) lx=px-18-tw; if(lx<0) lx=Math.max(0,(b.width-tw)/2);
  let ly=py-th/2; ly=Math.max(0,Math.min(ly,b.height-th));
  tip.style.left=lx+"px"; tip.style.top=ly+"px";
}
function hideTip(){tip.classList.remove("on","pinned");}
function ringR(d){return d.type==="centre"?0:(d.id==="rome"?13:(d.type==="spoke"?9:10));}
function hi(id){
  gP.selectAll("g.pin").select("circle.ring").attr("stroke-width",d=>d.id===id?2.2:1).attr("opacity",d=>d.id===id?1:.6)
    .attr("r",d=>ringR(d)+(d.id===id&&d.type!=="centre"?4:0));
  gA.selectAll("path").attr("opacity",d=>id?(d.id===id?1:.2):(d.type==="centre"?.35:.6)).attr("stroke-width",d=>d.id===id?2.2:(d.type==="centre"?1:1.3));
}
function arcD(d){const b=proj([d.lon,d.lat]);const mx=(rome[0]+b[0])/2,my=(rome[1]+b[1])/2-40;return `M${rome}Q${mx},${my} ${b}`;}

function draw(){
  const vis=state();
  const cur = limit==null ? phase : EVENTS[limit-1].p;
  const arcs=gA.selectAll("path").data(vis.filter(h=>h.id!=="rome"),d=>d.id).join(
    e=>e.append("path").attr("class","arc").attr("d",arcD)
      .each(function(){const L=this.getTotalLength();d3.select(this).attr("stroke-dasharray",L).attr("stroke-dashoffset",L).transition().duration(800).attr("stroke-dashoffset",0).on("end",function(){d3.select(this).attr("stroke-dasharray",d=>d.type==="centre"?"2 4":null);});}),
    u=>u,x=>x.remove());
  arcs.attr("stroke",colOf).attr("opacity",d=>d.type==="centre"?.35:.6).attr("stroke-width",d=>d.type==="centre"?1:1.3)
    .filter(function(){return !d3.active(this);}).attr("stroke-dasharray",d=>d.type==="centre"?"2 4":null);
  const pins=gP.selectAll("g.pin").data(vis,d=>d.id).join(e=>{
    const g=e.append("g").attr("class","pin").attr("tabindex",0).attr("role","button")
      .attr("transform",d=>`translate(${proj([d.lon,d.lat])})`)
      .on("mouseenter",(ev,d)=>{hi(d.id);if(!sel)showTip(d);})
      .on("mouseleave",()=>{hi(sel);if(!sel)hideTip();})
      .on("click",(ev,d)=>{ev.stopPropagation(); if(sel===d.id){sel=null;hideTip();hi(null);} else {sel=d.id;showTip(d,true);hi(d.id);}})
      .on("keydown",(ev,d)=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();sel=d.id;showTip(d,true);hi(d.id);}});
    g.append("circle").attr("class","hit").attr("r",d=>small.has(d.id)?8:14).attr("fill","transparent");
    g.append("circle").attr("class","ring").attr("r",0).attr("fill","none").attr("stroke-width",1).attr("opacity",.6);
    g.append("circle").attr("class","core").attr("r",0);
    g.append("text").attr("dy","0.32em").attr("x",d=>left.has(d.id)?-14:14).attr("text-anchor",d=>left.has(d.id)?"end":"start").attr("y",d=>dy[d.id]||0);
    return g;},u=>u,x=>x.remove());
  // update every pin to its current role (this is what makes a centre become a spoke, then a hub)
  pins.datum(d=>vis.find(v=>v.id===d.id)).attr("aria-label",d=>`${d.name}, ${TYPE[d.type]}`);
  pins.select("circle.ring").attr("stroke",colOf).attr("stroke-dasharray",d=>d.type==="spoke"?"3 3":null).transition().duration(500).attr("r",ringR);
  pins.select("circle.core").attr("stroke",d=>d.type==="centre"?GREY:"none").attr("stroke-width",1.4)
    .transition().duration(400).attr("fill",d=>d.type==="centre"?"rgba(27,39,112,.9)":colOf(d)).attr("r",d=>d.id==="rome"?5.5:(d.type==="centre"?3.2:(d.type==="spoke"?3.8:4.2)));
  pins.select("text").text(d=>d.name).attr("opacity",d=>d.type==="centre"?.7:1);
  if(sel){const d=vis.find(v=>v.id===sel); if(d) hi(sel); else {sel=null;hideTip();}}

  document.querySelectorAll(".tabs .pill").forEach(b=>b.setAttribute("aria-selected",+b.dataset.p===cur));
  const P=PH[cur];
  document.getElementById("when").textContent=P.when;
  document.getElementById("title").textContent=P.title;
  document.getElementById("lead").textContent=P.lead;
  document.getElementById("mPay").textContent=P.pay;
  document.getElementById("mGive").textContent=P.give;
  document.getElementById("mAI").textContent=P.ai;
  const open=vis.filter(h=>h.type!=="centre");
  document.getElementById("sHubs").textContent=vis.filter(h=>h.type==="hub").length;
  document.getElementById("sSpokes").textContent=vis.filter(h=>h.type==="spoke").length;
  document.getElementById("sCountries").textContent=new Set(open.map(h=>h.country)).size;
  document.getElementById("stamp").textContent=P.when;
}
function stop(){ if(playing){clearTimeout(playing);playing=null;} limit=null; document.getElementById("replay").setAttribute("aria-pressed","false"); }
document.querySelectorAll(".tabs .pill").forEach(b=>b.onclick=()=>{stop();phase=+b.dataset.p;sel=null;hideTip();draw();});
document.getElementById("replay").onclick=()=>{
  if(playing){stop();phase=3;draw();return;}
  sel=null;hideTip();document.getElementById("replay").setAttribute("aria-pressed","true");
  gA.selectAll("path").remove(); gP.selectAll("g.pin").remove();
  limit=1;draw();
  const step=()=>{ if(limit>=EVENTS.length){stop();phase=3;draw();return;}
    const pause = EVENTS[limit].p!==EVENTS[limit-1].p ? 1600 : 650;
    playing=setTimeout(()=>{limit++;draw();step();},pause); };
  step();
};
document.addEventListener("click",e=>{ if(sel && !tip.contains(e.target)){sel=null;hideTip();hi(null);} });
draw();
</script>
</body>
</html>
